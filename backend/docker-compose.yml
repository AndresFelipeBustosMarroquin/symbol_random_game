services:
  postgres:
    image: postgres:17
    container_name: symbol_random_game_postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: symbol_random_game_bd
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234

    ports:
      - "5433:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data: